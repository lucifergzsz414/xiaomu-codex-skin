name: 小睦皮肤问题反馈
description: 反馈小睦 Codex 1.0.0 的安装、外观和操作问题。
title: "[反馈] "
body:
  - type: markdown
    attributes:
      value: |
        当前正式版为 [1.0.0](https://github.com/lucifergzsz414/xiaomu-codex-skin/releases/tag/v1.0.0)，适配 Microsoft Store Codex **26.1111.2228.0**。
        请写实际发生的情况，截图先遮住私人内容。不知道的版本可以填“不确定”。
  - type: input
    id: skin-version
    attributes:
      label: 皮肤版本
      description: 以下载包或使用说明中的版本为准。
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 使用环境
      description: 请填写实际使用的 Microsoft Store Codex 包版本。
      placeholder: |
        Store Codex 版本：
        Windows 版本：
        Node.js 版本：
        是否首次安装（可选）：
    validations:
      required: true
  - type: dropdown
    id: problem-area
    attributes:
      label: 问题出现在哪里
      options:
        - 安装或升级
        - 启动或皮肤自动加载
        - 五秒片头或首页动态背景
        - 颜色、背景、图标或布局
        - 设置页
        - 搜索弹窗
        - 聊天右键菜单或子菜单
        - 终端
        - 文件差异面板
        - 仓库访问或命令执行审批
        - 其他控件操作
        - 暂停、恢复或修复
        - 其他或不确定
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 做了什么，出现了什么
      description: 写出操作步骤、实际结果和期望结果。
      placeholder: |
        操作步骤：
        实际结果：
        期望结果：
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 错误提示或截图（可选）
      description: 只附与问题有关、已遮住私人内容的截图或提示。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 填写内容和附件中没有聊天正文、登录资料、密钥、令牌或私人文件路径。
          required: true
