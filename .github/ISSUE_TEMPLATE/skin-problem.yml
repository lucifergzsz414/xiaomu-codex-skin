name: 小睦皮肤问题反馈
description: 反馈 3517 兼容测试版的安装、外观和操作问题，也接受旧版反馈。
title: "[反馈] "
body:
  - type: markdown
    attributes:
      value: |
        当前试用版为 [3517 兼容测试版](https://github.com/lucifergzsz414/xiaomu-codex-skin/releases/tag/v1.0.0-3517-rc1)，候选编号 **20261106-3517-rc1**，适配 Microsoft Store Codex **26.1103.3517.0**。
        聊天搜索弹窗、右键主菜单和子菜单已通过实机验收。**整包冷启动与独立 Windows 11 普通用户环境待验收。**
        旧版也可以反馈，请填写实际使用的版本。未尝试的场景可以写“未测试”，不知道的版本可以写“不确定”。
        这里是公开反馈区，请先遮住截图和错误提示里的私人内容。
  - type: input
    id: skin-version
    attributes:
      label: 皮肤版本与候选编号
      description: 以下载包或使用说明中的版本为准；不知道可以写“不确定”。
      placeholder: 例如 20261106-3517-rc1（运行版本 1.0.0）
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 使用环境
      description: 请填写实际使用的 Microsoft Store Codex 包版本。独立环境信息可选，无法确认的项目写“不确定”。
      placeholder: |
        Store Codex 版本：
        Windows 版本：
        Node.js 版本：
        是否在独立 Windows 11 普通用户环境测试（可选）：
    validations:
      required: true
  - type: dropdown
    id: problem-area
    attributes:
      label: 问题出现在哪里
      options:
        - 安装或升级
        - 启动或皮肤自动加载
        - 颜色、背景、图标或布局
        - 设置页
        - 搜索弹窗
        - 聊天右键菜单或子菜单
        - 其他控件操作
        - 暂停、恢复或修复
        - 其他或不确定
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 做了什么，出现了什么
      description: 写出能记得的步骤、实际结果和期望结果。偶发问题不必为了复现中断任务。
      placeholder: |
        操作步骤：
        实际结果：
        期望结果：
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 错误提示或截图（可选）
      description: 只附与问题有关、已脱敏的内容；不要上传整个日志目录或用户目录。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已检查填写内容和附件，没有包含聊天正文、登录资料、密钥、令牌或私人文件路径。
          required: true
