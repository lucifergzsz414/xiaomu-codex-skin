name: 小睦皮肤问题反馈
description: 记录安装、外观或暂停恢复时遇到的问题，也欢迎其他版本的反馈。
title: "[反馈] "
body:
  - type: markdown
    attributes:
      value: |
        请写实际发生的情况；没有测试过的场景可以写“未测试”，不知道的版本可以写“不确定”。
        这里是公开反馈区，请先遮住截图和错误提示里的私人内容。
  - type: input
    id: skin-version
    attributes:
      label: 皮肤版本与候选编号
      description: 以下载包或使用说明中的版本为准；不知道可以写“不确定”。
      placeholder: 例如 1.0.0-beta.2 / 20261031-3384-rc2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 使用环境
      description: Codex 请填写 Microsoft Store 包版本；无法确认的项目写“不确定”即可。
      placeholder: |
        Store Codex 版本：
        Windows 版本：
        Node.js 版本：
    validations:
      required: true
  - type: dropdown
    id: problem-area
    attributes:
      label: 问题出现在哪里
      options:
        - 安装或升级
        - 启动或皮肤自动加载
        - 颜色、背景、图标或布局
        - 菜单或其他控件操作
        - 暂停、恢复或修复
        - 其他或不确定
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 做了什么，出现了什么
      description: 写出能记得的步骤、实际结果和期望结果。偶发问题不必为了复现中断任务。
      placeholder: |
        操作步骤：
        实际结果：
        期望结果：
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 错误提示或截图（可选）
      description: 只附与问题有关、已脱敏的内容；不要上传整个日志目录或用户目录。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已检查填写内容和附件，没有包含聊天正文、登录资料、密钥、令牌或私人文件路径。
          required: true
